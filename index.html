<script>
/* 비밀기지 · Supabase 연결부
   앱이 쓰는 claude.use("db"|"user"|"assets") 모양을 그대로 흉내 내서 Supabase에 저장해요. */
(function(){
  const C=Object.assign({},window.HIMITSU_CONFIG||{});C.url=String(C.url||"").trim().replace(/\/(rest|auth|storage)\/v1.*$/i,"").replace(/\/+$/,"");C.anonKey=String(C.anonKey||C.key||C.anon||"").trim();
  let reason="";
  if(!window.HIMITSU_CONFIG)reason="config.js를 읽지 못했어요. 파일 이름이 정확히 config.js인지, index.html과 같은 곳에 있는지, 따옴표·쉼표가 지워지지 않았는지 확인해 주세요.";
  else if(!C.url||/여기에/.test(C.url))reason="config.js의 url 칸이 비어 있어요. Supabase의 Project URL을 넣어 주세요.";
  else if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(C.url))reason="config.js의 url 모양이 이상해요. https://xxxx.supabase.co 형태로 끝에 다른 글자 없이 넣어 주세요. (지금: "+C.url.slice(0,60)+")";
  else if(!C.anonKey||/여기에/.test(C.anonKey))reason="config.js의 anonKey 칸이 비어 있어요. Supabase의 anon public 키를 넣어 주세요.";
  else if(!(window.supabase&&window.supabase.createClient))reason="Supabase 연결 프로그램을 불러오지 못했어요. 인터넷 연결이나 광고 차단 확장을 확인하고 새로고침해 주세요.";
  const configured=!reason;
  const sb=configured?window.supabase.createClient(C.url.replace(/\/+$/,""),C.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"himitsu.auth"}}):null;
  const ID_DOMAIN=C.idDomain||"himitsu-base.com";
  const st={session:null,member:false,name:""};
  const H=window.HIMITSU={sb,configured,reason,state:()=>Object.assign({},st),ID_DOMAIN};
  const err=(e,fallback)=>{const m=(e&&e.message)||"";const o={msg:fallback||"저장하지 못했어요. 잠시 후 다시 시도해 주세요.",detail:m,code:e&&e.code};
    if(/row-level security|permission denied/i.test(m))o.msg="쓰기 권한이 없어요. 로그인과 초대코드를 확인해 주세요.";
    if(/JWT|token/i.test(m))o.msg="로그인이 만료됐어요. 다시 로그인해 주세요.";return o};
  const ready=(async()=>{if(!sb)return;try{const {data}=await sb.auth.getSession();st.session=data.session||null;
      if(st.session){const {data:m}=await sb.from("members").select("uid,name").eq("uid",st.session.user.id).maybeSingle();st.member=!!m;st.name=m?m.name:""}}catch(e){console.warn(e)}})();
  H.ready=ready;

  const colOf=p=>p.slice(0,p.lastIndexOf("/")),idOf=p=>p.slice(p.lastIndexOf("/")+1);
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const colSubs=new Map(),docSubs=new Map();
  function dispatch(path,data){const col=colOf(path),id=idOf(path);
    const cs=colSubs.get(col);if(cs)for(const s of cs){if(data==null)s.cache.delete(id);else s.cache.set(id,data);s.fire()}
    const ds=docSubs.get(path);if(ds)for(const s of ds){s.val=data;s.fire()}}
  let chan=null;
  function reloadAll(){for(const set of colSubs.values())for(const s of set)s.load();for(const set of docSubs.values())for(const s of set)s.load()}
  function ensureChan(){if(chan||!sb)return;
    chan=sb.channel("himitsu-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{
      const del=pl.eventType==="DELETE";const path=del?(pl.old&&pl.old.path):(pl.new&&pl.new.path);if(!path)return;dispatch(path,del?null:pl.new.data)})
      .subscribe(s=>{if(s==="SUBSCRIBED")reloadAll()});
    setInterval(()=>{if(!document.hidden)reloadAll()},45000)}
  async function fetchCol(path){const out=[];const step=1000;for(let from=0;;from+=step){
      const {data,error}=await sb.from("docs").select("id,data").eq("col",path).range(from,from+step-1);if(error)throw error;out.push(...data);if(data.length<step)break}return out}
  const snapDocs=list=>({docs:list.map(([id,d])=>({id,exists:true,data:()=>clone(d)})),get size(){return list.length},get empty(){return !list.length}});
  function query(path,opt){opt=opt||{};
    const apply=entries=>{let a=[...entries];
      for(const [f,op,v] of (opt.where||[]))a=a.filter(([,d])=>{const x=d&&d[f];return op==="=="||op==="eq"?x===v:op==="!="?x!==v:op==="<"?x<v:op==="<="?x<=v:op===">"?x>v:op===">="?x>=v:op==="in"?(v||[]).includes(x):op==="array-contains"?Array.isArray(x)&&x.includes(v):true});
      if(opt.order){const [f,dir]=opt.order;const s=dir==="desc"?-1:1;a.sort((p,q)=>{const x=p[1]&&p[1][f],y=q[1]&&q[1][f];return (x>y?1:x<y?-1:0)*s})}
      if(opt.limit)a=a.slice(0,opt.limit);return a};
    const q={
      orderBy:(f,dir)=>query(path,Object.assign({},opt,{order:[f,dir||"asc"]})),
      limit:n=>query(path,Object.assign({},opt,{limit:n})),
      where:(f,op,v)=>query(path,Object.assign({},opt,{where:[...(opt.where||[]),[f,op,v]]})),
      doc:id=>docRef(path+"/"+(id||rid())),
      add:async d=>{const r=docRef(path+"/"+rid());await r.set(d);return r},
      get:async()=>{const rows=await fetchCol(path);return snapDocs(apply(rows.map(r=>[r.id,r.data])))},
      onSnapshot:(next,onErr)=>{const s={cache:new Map(),loaded:false,t:0};
        s.fire=()=>{if(!s.loaded)return;clearTimeout(s.t);s.t=setTimeout(()=>next(snapDocs(apply(s.cache.entries()))),0)};
        s.load=async()=>{try{const rows=await fetchCol(path);s.cache=new Map(rows.map(r=>[r.id,r.data]));s.loaded=true;s.fire()}catch(e){console.warn(path,e);if(onErr)onErr(err(e));else{s.loaded=true;s.fire()}}};
        if(!colSubs.has(path))colSubs.set(path,new Set());colSubs.get(path).add(s);ensureChan();s.load();
        return ()=>{const set=colSubs.get(path);if(set)set.delete(s)}}};
    return q}
  function docRef(path){
    const r={id:idOf(path),path,
      get:async()=>{const {data,error}=await sb.from("docs").select("data").eq("path",path).maybeSingle();if(error)throw err(error,"불러오지 못했어요.");return {id:r.id,exists:!!data,data:()=>data?clone(data.data):undefined}},
      set:async d=>{const data=clone(d)||{};const {error}=await sb.from("docs").upsert({path,col:colOf(path),id:idOf(path),data,updated_at:new Date().toISOString()});if(error)throw err(error);dispatch(path,data)},
      update:async d=>{const {data,error}=await sb.rpc("doc_merge",{p_path:path,p_patch:clone(d)||{}});if(error)throw err(error);dispatch(path,data)},
      delete:async()=>{const {error}=await sb.from("docs").delete().eq("path",path);if(error)throw err(error,"지우지 못했어요.");dispatch(path,null)},
      acquire:async()=>({acquired:true}),
      collection:c=>query(path+"/"+c),
      onSnapshot:(next,onErr)=>{const s={val:undefined,loaded:false};
        s.fire=()=>{if(s.loaded)next({id:r.id,exists:s.val!=null,data:()=>clone(s.val)})};
        s.load=async()=>{const {data,error}=await sb.from("docs").select("data").eq("path",path).maybeSingle();if(error){console.warn(path,error);if(onErr)onErr(err(error));return}s.val=data?data.data:null;s.loaded=true;s.fire()};
        if(!docSubs.has(path))docSubs.set(path,new Set());docSubs.get(path).add(s);ensureChan();s.load();
        return ()=>{const set=docSubs.get(path);if(set)set.delete(s)}}};
    return r}
  const db={doc:docRef,collection:p=>query(p)};
  const user={id:async()=>st.session?st.session.user.id:null,me:async()=>({id:st.session?st.session.user.id:null,name:st.name}),
    isOwner:async()=>st.member,canEdit:async()=>st.member,can:async()=>st.member,
    profiles:async ids=>{const out={};ids=[...new Set((ids||[]).filter(Boolean))];if(!ids.length)return out;
      try{const {data}=await sb.from("members").select("uid,name").in("uid",ids);for(const m of data||[])out[m.uid]={id:m.uid,name:m.name||"",avatarUrl:""}}catch(e){}
      for(const i of ids)if(!out[i])out[i]={id:i,name:"",avatarUrl:""};return out}};

  sub("characters","chars","asc",v=>S.chars=v);
  sub("photos","photos","desc",v=>S.photos=v);
  sub("tracks","tracks","asc",v=>{const cur=P.idx>=0&&S.tracks[P.idx]?S.tracks[P.idx].id:null;S.tracks=v;P.idx=cur?v.findIndex(t=>t.id===cur):-1;updatePlayerUI()});
  sub("chats","chats","desc",v=>S.chats=v);
  sub("msgs","msgs","desc",v=>S.msgs=v.reverse());
  sub("pets","pets",null,v=>{S.pets={};for(const p of v)S.pets[p.id]=p});
  sub("minirooms","minirooms",null,v=>{if(S.dragging)return;S.minirooms={};for(const r of v)S.minirooms[r.id]=r});
  sub("desk","desk","asc",v=>S.desk=v);
  sub("hpstk","hpstk","asc",v=>S.hpstk=v,300);
  sub("stickers","stickers","asc",v=>S.stickers=v.sort((a,b)=>(a.z||1)-(b.z||1)),200);
  sub("guestbook","guest","desc",v=>S.guest=v,500);
  sub("visits","visits",null,v=>{S.visits=v;visit()});
  db.doc("site/main").onSnapshot(s=>{S.site=s.exists?s.data():null;bump("site")},e=>console.warn(e));
  sub("wallslots","wallslots",null,v=>{S.wslots={};for(const d of v)S.wslots[d.id]=d;bump("site")});
  if(S.meId)db.doc("data/users/"+S.meId+"/wall").onSnapshot(s=>{S.mywall=s.exists?s.data():null;bump("site")},e=>console.warn(e));
}
boot();
})();
</script>
</body>
</html>
